<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부업 강의 추천 상담봇</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#FAF9FF;color:#1a1a2e;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}

/* ── 카카오톡 스타일 폰 프레임 ── */
.phone{width:100%;max-width:390px;height:90dvh;max-height:780px;background:#fff;border-radius:32px;box-shadow:0 24px 60px rgba(80,60,180,.18),0 4px 16px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column;border:6px solid #1a1a2e}

/* 상단바 */
.topbar{background:#3A1D96;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.bot-icon{width:36px;height:36px;border-radius:50%;background:#F5C842;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.bot-info{flex:1}
.bot-name{font-size:14px;font-weight:700;color:#fff}
.bot-status{font-size:11px;color:rgba(255,255,255,.7)}
.menu-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.menu-dots{display:flex;gap:3px;align-items:center}

/* 채팅 영역 */
.chat-bg{flex:1;overflow-y:auto;padding:14px 12px;background:#B2C7F0;display:flex;flex-direction:column;gap:10px}
.chat-bg::-webkit-scrollbar{width:3px}
.chat-bg::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:3px}

/* 날짜 구분선 */
.date-divider{text-align:center;font-size:11px;color:rgba(0,0,0,.45);margin:4px 0 8px;background:rgba(255,255,255,.4);display:inline-block;align-self:center;padding:3px 12px;border-radius:20px}

/* 메시지 행 */
.msg-row{display:flex;gap:6px;align-items:flex-end}
.msg-row.me{flex-direction:row-reverse}

.av{width:34px;height:34px;border-radius:50%;background:#F5C842;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* 말풍선 */
.bubble{max-width:72%;padding:10px 13px;font-size:13.5px;line-height:1.65;white-space:pre-line;position:relative}
.bubble.bot{background:#fff;border-radius:4px 16px 16px 16px;color:#1a1a2e}
.bubble.me{background:#F5C842;border-radius:16px 4px 16px 16px;color:#1a1a2e}
.time{font-size:10px;color:rgba(0,0,0,.4);padding-bottom:2px}

/* 선택지 버튼 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 14px;border:1.5px solid #3A1D96;border-radius:20px;background:#fff;color:#3A1D96;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.3}
.chip:hover{background:#3A1D96;color:#fff}
.chip:disabled{background:#ddd;border-color:#ddd;color:#999;cursor:default}

/* 추천 카드 */
.rec-card{background:#fff;border-radius:12px;overflow:hidden;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.rec-card-header{padding:10px 13px 6px;background:linear-gradient(135deg,#3A1D96,#6B3FE0)}
.rec-rank-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.5);margin-bottom:4px}
.rec-card-name{font-size:14px;font-weight:700;color:#fff}
.rec-card-body{padding:10px 13px}
.rec-why{font-size:12px;color:#333;line-height:1.7;padding:1px 0}
.rec-why::before{content:"✓ ";color:#0F9E6E;font-weight:700}
.rec-btn{display:block;margin:10px 13px;padding:9px;background:#F5C842;border-radius:8px;text-align:center;font-size:13px;font-weight:700;color:#1a1a2e;text-decoration:none;cursor:pointer;border:none;font-family:inherit;width:calc(100% - 26px)}
.rec-btn:hover{background:#e8b800}

/* 타이핑 */
.typing{display:flex;gap:4px;align-items:center;padding:2px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:#aaa;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* 입력창 */
.inputbar{background:#fff;padding:8px 10px;display:flex;gap:8px;align-items:center;border-top:0.5px solid #eee;flex-shrink:0}
.inputbar input{flex:1;padding:9px 14px;border:1px solid #ddd;border-radius:22px;font-size:13px;font-family:inherit;background:#f8f8f8;color:#1a1a2e;outline:none}
.inputbar input:focus{border-color:#3A1D96;background:#fff}
.send-btn{width:38px;height:38px;border-radius:50%;background:#3A1D96;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:16px;height:16px;fill:#fff}

/* API 설정 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:6px;color:#1a1a2e}
.modal p{font-size:12.5px;color:#666;margin-bottom:16px;line-height:1.6}
.modal input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:13px;font-family:inherit;margin-bottom:12px;outline:none}
.modal input:focus{border-color:#3A1D96}
.modal-btn{width:100%;padding:12px;background:#3A1D96;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px}
.modal-btn:hover{background:#6B3FE0}
.modal-skip{width:100%;padding:10px;background:none;border:1px solid #ddd;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;color:#666}
.modal-note{font-size:11px;color:#aaa;text-align:center;margin-top:10px;line-height:1.5}

/* 헤더 버튼 */
.setting-btn{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px}
.setting-btn svg{width:20px;height:20px;fill:rgba(255,255,255,.7)}
</style>
</head>
<body>

<!-- API 설정 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>🤖 AI 상담봇 설정</h2>
    <p>자유 질문 AI 응답을 위해 Anthropic API 키를 입력해주세요.<br>키 없이도 기본 상담 플로우는 작동합니다.</p>
    <input type="password" id="api-input" placeholder="sk-ant-api03-...">
    <button class="modal-btn" onclick="saveKey()">시작하기</button>
    <button class="modal-skip" onclick="skipKey()">API 키 없이 시작 (기본 모드)</button>
    <div class="modal-note">API 키는 이 기기 브라우저에만 저장되며<br>외부로 전송되지 않습니다.</div>
  </div>
</div>

<!-- 폰 프레임 -->
<div class="phone">
  <div class="topbar">
    <div class="bot-icon">🎯</div>
    <div class="bot-info">
      <div class="bot-name">부업 강의 추천봇</div>
      <div class="bot-status">온라인</div>
    </div>
    <button class="setting-btn" onclick="openSettings()" title="API 설정">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
    <div class="menu-dots"><div class="menu-dot"></div><div class="menu-dot"></div><div class="menu-dot"></div></div>
  </div>

  <div class="chat-bg" id="msgs">
    <div class="date-divider">오늘</div>
  </div>

  <div class="inputbar">
    <input id="utxt" type="text" placeholder="추천 후 자유롭게 질문하세요..." onkeydown="if(event.key==='Enter')sendFree()">
    <button class="send-btn" onclick="sendFree()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
let apiKey = '';
let answers = {}, chatDone = false;

const LECTURES = {
  '위탁판매':      {desc:'재고 없이 위탁 판매로 수익 창출', icon:'📦', link:'#'},
  '포이즌리셀':    {desc:'한정판 리셀로 고마진 수익 실현',  icon:'👟', link:'#'},
  '쇼핑쇼츠수익화':{desc:'숏폼 영상으로 커미션 수익 창출', icon:'🎬', link:'#'},
  '중국구매대행':  {desc:'중국 상품 구매대행으로 마진 확보', icon:'🌏', link:'#'}
};

const FLOW = [
  {key:'capital', q:'안녕하세요! 😊\n딱 맞는 부업 강의를 찾아드릴게요.\n\n부업 초기 자본이 어느 정도 되시나요?',
   choices:['10만원 미만 (거의 무자본)','10~50만원','50~200만원','200만원 이상']},
  {key:'time', q:'하루에 부업에 쓸 수 있는 시간은요?',
   choices:['1시간 이하','1~2시간','2~4시간','4시간 이상']},
  {key:'skill', q:'현재 어떤 경험이 있으신가요?',
   choices:['SNS·영상 제작 경험','쇼핑몰 운영 경험','해외직구·구매대행 경험','특별한 경험 없음']},
  {key:'goal', q:'부업 수익 목표가 어떻게 되세요?',
   choices:['월 30~50만원 안정 수익','월 100만원 이상','빠른 고수익 실현','장기 사업 확장']},
  {key:'style', q:'어떤 스타일의 일을 좋아하세요?',
   choices:['콘텐츠 만들기 (영상·글)','상품 소싱·판매 집중','트렌드 빠르게 캐치','시스템 구축 후 자동화']}
];

function now(){
  return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

const $m = ()=>document.getElementById('msgs');
function scroll(){$m().scrollTop=$m().scrollHeight}

function addBot(text, extra){
  const row=document.createElement('div'); row.className='msg-row';
  const av=document.createElement('div'); av.className='av'; av.textContent='🎯';
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:2px;max-width:78%';
  const bub=document.createElement('div'); bub.className='bubble bot'; bub.textContent=text;
  if(extra) bub.appendChild(extra);
  const t=document.createElement('div'); t.className='time'; t.textContent=now();
  wrap.append(bub,t); row.append(av,wrap); $m().appendChild(row); scroll(); return bub;
}

function addMe(text){
  const row=document.createElement('div'); row.className='msg-row me';
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:72%';
  const bub=document.createElement('div'); bub.className='bubble me'; bub.textContent=text;
  const t=document.createElement('div'); t.className='time'; t.textContent=now();
  wrap.append(bub,t); $m().appendChild(row); row.append(wrap); scroll();
}

function showTyping(){
  const row=document.createElement('div'); row.className='msg-row'; row.id='typing-row';
  const av=document.createElement('div'); av.className='av'; av.textContent='🎯';
  const bub=document.createElement('div'); bub.className='bubble bot';
  bub.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  row.append(av,bub); $m().appendChild(row); scroll();
}
function removeTyping(){const t=document.getElementById('typing-row');if(t)t.remove();}

function makeChips(choices, cb){
  const div=document.createElement('div'); div.className='chips';
  choices.forEach(c=>{
    const btn=document.createElement('button'); btn.className='chip'; btn.textContent=c;
    btn.onclick=()=>{div.querySelectorAll('.chip').forEach(b=>{b.disabled=true;b.style.cssText='background:#ddd;border-color:#ddd;color:#999;cursor:default'}); cb(c);};
    div.appendChild(btn);
  });
  return div;
}

function calcScore(ans){
  let s={'위탁판매':0,'포이즌리셀':0,'쇼핑쇼츠수익화':0,'중국구매대행':0};
  const{capital,time,skill,goal,style}=ans;
  if(capital?.includes('10만원 미만')||capital?.includes('10~50')){s['위탁판매']+=2;s['쇼핑쇼츠수익화']+=2;}
  if(capital?.includes('50~200')||capital?.includes('200만원')){s['중국구매대행']+=2;s['포이즌리셀']+=2;}
  if(time?.includes('1시간 이하')||time?.includes('1~2')){s['위탁판매']+=1;s['쇼핑쇼츠수익화']+=1;}
  if(time?.includes('2~4')||time?.includes('4시간')){s['중국구매대행']+=1;s['포이즌리셀']+=1;}
  if(skill?.includes('SNS'))s['쇼핑쇼츠수익화']+=3;
  if(skill?.includes('쇼핑몰'))s['위탁판매']+=2;
  if(skill?.includes('해외직구'))s['중국구매대행']+=3;
  if(skill?.includes('특별한')){s['위탁판매']+=1;s['쇼핑쇼츠수익화']+=1;}
  if(goal?.includes('30~50'))s['위탁판매']+=2;
  if(goal?.includes('100만원')){s['중국구매대행']+=2;s['쇼핑쇼츠수익화']+=1;}
  if(goal?.includes('빠른'))s['포이즌리셀']+=3;
  if(goal?.includes('장기'))s['중국구매대행']+=2;
  if(style?.includes('콘텐츠'))s['쇼핑쇼츠수익화']+=3;
  if(style?.includes('소싱')){s['위탁판매']+=2;s['중국구매대행']+=1;}
  if(style?.includes('트렌드'))s['포이즌리셀']+=3;
  if(style?.includes('자동화'))s['위탁판매']+=2;
  return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
}

function buildReasons(name,ans){
  const{capital,time,skill,goal}=ans;
  const pool={
    '위탁판매':[
      '재고 없이 시작 → '+(capital?.includes('200')?'리스크 최소화':'소자본에 딱 맞는 구조'),
      (time?.includes('1시간')||time?.includes('1~2'))?'하루 1~2시간으로도 운영 가능':'시스템 구축 후 자동화 가능',
      skill?.includes('쇼핑몰')?'기존 경험으로 빠른 실전 적용 가능':'초보자도 2주 안에 첫 판매 가능'
    ],
    '포이즌리셀':[
      '트렌드 감각이 바로 수익으로 연결되는 구조',
      goal?.includes('빠른')?'단기 고수익 실현 사례 가장 많은 모델':'한정판 희소성 기반 프리미엄 마진',
      '국내 리셀 시장 매년 성장 중'
    ],
    '쇼핑쇼츠수익화':[
      skill?.includes('SNS')?'기존 영상 역량을 바로 수익화 가능':'재고 없이 커미션 기반 → 리스크 제로',
      '구독자 없어도 알고리즘으로 수익 발생 가능',
      '영상 1개가 지속적인 수익원이 되는 구조'
    ],
    '중국구매대행':[
      skill?.includes('해외직구')?'기존 경험이 즉시 강점으로 작용':'중국 소싱 노하우 단기간 습득 가능',
      '중국-한국 가격 차이로 안정적 고마진 구조',
      goal?.includes('장기')?'자체 브랜드·사업 확장까지 로드맵 제공':'안정 수익 후 사업화 전환 가능'
    ]
  };
  return pool[name]||[];
}

function showResult(top2){
  const bub=addBot('분석 완료! 추천 강의를 확인해보세요 👇');
  top2.forEach((name,i)=>{
    const lc=LECTURES[name];
    const card=document.createElement('div'); card.className='rec-card';
    card.innerHTML=`
      <div class="rec-card-header">
        <div class="rec-rank-badge">${i===0?'🥇 1순위 추천':'🥈 2순위 추천'}</div>
        <div class="rec-card-name">${lc.icon} ${name}</div>
      </div>
      <div class="rec-card-body">
        <div style="font-size:12px;color:#666;margin-bottom:6px">${lc.desc}</div>
        ${buildReasons(name,answers).map(r=>`<div class="rec-why">${r}</div>`).join('')}
      </div>
      <button class="rec-btn" onclick="alert('강의 랜딩 페이지 링크를 여기에 연결하세요!')">강의 자세히 보기 →</button>
    `;
    bub.appendChild(card);
  });
  const note=document.createElement('div');
  note.style.cssText='font-size:12.5px;color:#555;margin-top:10px';
  note.textContent='궁금한 점이 있으시면 아래에 질문해 주세요! 😊';
  bub.appendChild(note);
  chatDone=true;
}

function ask(i){
  if(i>=FLOW.length){
    setTimeout(()=>{showTyping();setTimeout(()=>{removeTyping();showResult(calcScore(answers));},900);},300);
    return;
  }
  const q=FLOW[i];
  const chips=makeChips(q.choices,val=>{addMe(val);answers[q.key]=val;setTimeout(()=>ask(i+1),400);});
  setTimeout(()=>{showTyping();setTimeout(()=>{removeTyping();addBot(q.q,chips);},700);},i===0?600:200);
}

async function sendFree(){
  const inp=document.getElementById('utxt');
  const txt=inp.value.trim(); if(!txt)return;
  inp.value=''; addMe(txt); showTyping();
  if(!apiKey){
    setTimeout(()=>{removeTyping();addBot('API 키를 설정하시면 AI 상담이 가능해요 😊\n우측 상단 ⚙️ 버튼을 눌러 설정해보세요!');},700);
    return;
  }
  try{
    const sys=`당신은 부업 강의 플랫폼 상담 AI입니다. 운영 강의: 위탁판매, 포이즌리셀, 쇼핑쇼츠수익화, 중국구매대행. 고객 답변: ${JSON.stringify(answers)}. 친절하게 150자 이내로 답변하세요.`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,system:sys,messages:[{role:'user',content:txt}]})});
    const d=await r.json();
    removeTyping(); addBot(d.content?.[0]?.text||'잠시 후 다시 시도해 주세요.');
  }catch(e){removeTyping();addBot('잠시 후 다시 시도해 주세요.');}
}

function saveKey(){
  const k=document.getElementById('api-input').value.trim();
  if(k){apiKey=k;localStorage.setItem('_akey',k);}
  document.getElementById('modal').style.display='none';
  ask(0);
}
function skipKey(){
  document.getElementById('modal').style.display='none';
  ask(0);
}
function openSettings(){
  document.getElementById('api-input').value=apiKey||'';
  document.getElementById('modal').style.display='flex';
}

// 저장된 키 불러오기
const saved=localStorage.getItem('_akey');
if(saved){apiKey=saved;document.getElementById('modal').style.display='none';ask(0);}
</script>
